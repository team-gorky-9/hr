# Include inside the existing HTTPS server block for gorky.bond.
# TLS certificates and renewal remain managed by host Certbot.
location ~ ^/(legacy|workforce|requirements|hiring|students|mobility|social-support|recognition|feedback)/ {
    client_max_body_size 21m;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_next_upstream off;
    access_log off;
}
