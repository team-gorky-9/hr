worker_processes auto;
events { worker_connections 1024; }
http {
    # Do not log URLs (feedback access codes and private document identifiers).
    access_log off;
    error_log /var/log/nginx/error.log warn;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Listener is loopback-only; the host TLS proxy is the trusted sender.
    map $http_x_forwarded_proto $upstream_proto {
        default $scheme;
        https https;
    }
    map $uri $service {
        default "";
        ~^/legacy/ legacy;
        ~^/workforce/ workforce;
        ~^/requirements/ requirements;
        ~^/hiring/ hiring;
        ~^/students/ students;
        ~^/mobility/ mobility;
        ~^/social-support/ social-support;
        ~^/recognition/ recognition;
        ~^/feedback/ feedback;
    }
    server {
        listen 8080;
        client_max_body_size 21m;
        include /etc/nginx/interaction/*.conf;
        location / {
            if ($service = "") { return 404; }
            # Preserve method, body, query and auth headers; strip exactly one prefix.
            rewrite ^/[^/]+/(.*)$ /$1 break;
            proxy_pass http://$service:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $upstream_proto;
            # Internal gateway credentials must never come from the browser.
            proxy_set_header X-Interaction-Gateway-Key "";
            proxy_set_header X-Interaction-User-Id "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_next_upstream off;
            add_header Cache-Control "no-store" always;
        }
    }
}
