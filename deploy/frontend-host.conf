# Include inside the existing HTTPS server block for gorky.bond.
root /var/www/hr-frontend;
index index.html;
location / {
    try_files $uri $uri/ /index.html;
}
location /workforce-api/ {
    proxy_pass http://127.0.0.1:8080/workforce/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /support-api/ {
    proxy_pass http://127.0.0.1:8080/social-support/api/v1/support/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /requirements-api/ {
    proxy_pass http://127.0.0.1:8080/requirements/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /hiring-api/ {
    proxy_pass http://127.0.0.1:8080/hiring/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
