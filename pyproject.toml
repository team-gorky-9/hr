[project]
name = "hr-platform"
version = "0.1.0"
description = "ИИ-платформа подбора кандидатов для кадрового подразделения администрации"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "openai>=1.40",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymorphy3>=2.0.6",
    "pypdf>=5,<7",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
    "xlsxwriter>=3.2,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
