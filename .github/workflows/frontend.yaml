name: Frontend delivery
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'deploy/frontend*', 'deploy/test_frontend_release.py', '.github/workflows/frontend.yaml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'deploy/frontend*', 'deploy/test_frontend_release.py', '.github/workflows/frontend.yaml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    environment: frontend
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/test_frontend_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_ARCHIVE_API_BASE: /legacy/api/v1
          VITE_RECRUITMENT_API_BASE: /legacy/api/v1
          VITE_RECRUITMENT_RECIPIENT_ID: ${{ vars.RECRUITMENT_RECIPIENT_ID }}
          VITE_STUDENTS_API_BASE: /students/api/v1/students
          VITE_SUPPORT_API_BASE: /social-support/api/v1/support
          VITE_DEVELOPMENT_API_BASE: /workforce/api/v1
          VITE_HIRING_API_BASE: /hiring/api/v1
          VITE_REQUIREMENTS_API_BASE: /requirements/api/v1
      - name: Wait for matching backend release when this commit changes it
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow backend.yaml --commit "$GITHUB_SHA" --event push --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run watch "$run_id" --exit-status --interval 15
          fi
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA" || { echo 'A newer main exists; do not publish stale frontend.'; exit 1; }
      - name: Deploy frontend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.FRONTEND_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FRONTEND_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.FRONTEND_HOST }}
          DEPLOY_USER: ${{ secrets.FRONTEND_USER }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          tar -czf /tmp/frontend.tar.gz -C frontend/dist .
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/frontend-receive.py "$DEPLOY_USER@$DEPLOY_HOST:/opt/hr/frontend-receive.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "python3 /opt/hr/frontend-receive.py $GITHUB_SHA" < /tmp/frontend.tar.gz
          curl --fail --retry 3 https://gorky.bond/version.json | grep -F "$GITHUB_SHA"
