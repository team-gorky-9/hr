[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "requirements-service"
version = "0.1.0"
description = "Автономный сервис подготовки, согласования и выпуска требований к должности (волна 1)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pika>=1.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5,<7",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/requirements_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: требует запущенных PostgreSQL 17 и RabbitMQ (TEST_DATABASE_URL, TEST_RABBITMQ_URL)",
]
