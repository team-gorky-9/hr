[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobility-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "sqlalchemy>=2.0.36", "alembic>=1.14", "psycopg[binary]>=3.2", "pydantic>=2.9", "pydantic-settings>=2.6"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["mobility"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
