[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "social-support-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "python-multipart>=0.0.20"]
[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]
[tool.hatch.build.targets.wheel]
packages = ["support"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
